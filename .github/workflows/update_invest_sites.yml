name: 투자사이트 글 수집
on:
  schedule:
    # 한국시간 오후 4:41(UTC 07:41), 평일. 장마감(15:30) 뒤 기술점수 워크플로우(16:07)보다 늦게 돌려 같은 시각 푸시 충돌을 피한다.
    # GitHub Actions 스케줄은 '최선노력'이라 몇~수십 분 지연될 수 있다 — 앱은 마지막 업데이트 시각을 화면에 보여준다.
    - cron: '41 7 * * 1-5'
  workflow_dispatch:
    inputs:
      backfill_days:
        description: '과거 목록을 더 모을 일수(영향도 표본 확대용, 최초 1회 365 권장). 0이면 최근 글만'
        required: false
        default: '0'
permissions:
  contents: write
concurrency:
  group: stock-assitance-invest-sites
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 패키지 설치
        run: |
          pip install -r requirements.txt
      - name: 새 글 수집·요약·주가 반응 계산
        env:
          # 저장소 Settings → Secrets and variables → Actions 에 GROQ_API_KEY를 등록하면 LLM 요약을 쓰고, 없으면 원문 발췌 요약으로 동작한다.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python update_invest_sites.py --days 10 --max-llm 30 --backfill-days "${{ github.event.inputs.backfill_days || '0' }}"
      - name: 결과 자동 커밋 & 푸시
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "Stock Assitance Bot"
          git add invest_sites_data.json invest_sites_history
          if git diff --staged --quiet; then
            echo "변경사항 없음 — 커밋 생략"
          else
            git commit -m "자동 업데이트(투자사이트): $(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST')"
            git pull --rebase origin main
            git push origin main
          fi
